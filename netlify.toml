[build]
  command = "python scripts/verify_canonical_integration.py --source-only && python tools/build_netlify_deep_guide.py && python tools/inject_deluxe_legacy_context.py && python scripts/verify_canonical_integration.py"
  publish = "dist/tri-county-netlify-guide-deep"

[build.environment]
  PUBLIC_SITE_ORIGIN = "https://newmexicocoloradoguide.netlify.app"
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
