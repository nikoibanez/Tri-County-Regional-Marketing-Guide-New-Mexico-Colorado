name: Weekly directory query check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-directory-query-check
  cancel-in-progress: false

jobs:
  directory-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify current Luna/canonical checkpoint
        id: canonical
        run: |
          git fetch origin master
          python scripts/verify_canonical_integration.py --require-current-master --source-only
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Capture open integration work
        id: coordination
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/capture_open_pr_context.py

      - name: Run weekly directory query check
        run: python scripts/weekly_directory_query_check.py

      - name: Build generated directory for quality checks
        run: python tools/build_netlify_deep_guide.py

      - name: Audit every directory connection path
        run: python scripts/audit_directory_connectivity.py --workers 16 --timeout 10

      - name: Review physical and digital outreach routes
        run: python scripts/audit_directory_outreach_channels.py --fail-on-missing

      - name: Audit directory quality
        run: python scripts/audit_directory_quality.py --fail-on-blocking

      - name: Build maintenance dashboard
        run: python scripts/build_maintenance_dashboard.py

      - name: Verify canonical generated structure
        run: python scripts/verify_canonical_integration.py

      - name: Prepare directory-candidate review pull request
        id: review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/directory-auto-update-candidates.json
          git add data/directory-connectivity-status.json
          git add review/directory-watch/directory-watch-latest.json review/directory-watch/directory-watch-latest.md
          git add review/directory-connectivity/directory-connectivity-latest.json
          git add review/directory-connectivity/directory-connectivity-latest.csv
          git add review/directory-connectivity/directory-connectivity-latest.md
          git add review/directory-outreach/directory-outreach-latest.json
          git add review/directory-outreach/directory-outreach-latest.csv
          git add review/directory-outreach/directory-outreach-latest.md
          git add review/maintenance/maintenance-dashboard-latest.json review/maintenance/maintenance-dashboard-latest.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            branch="automation/directory-watch-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "Refresh weekly directory candidates"
            git push --set-upstream origin "$branch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Open directory-candidate review pull request
        if: steps.review.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: ${{ steps.review.outputs.branch }}
          CANONICAL_BASE_SHA: ${{ steps.canonical.outputs.base_sha }}
          OPEN_PR_CONTEXT: ${{ steps.coordination.outputs.open_pr_context }}
        run: |
          body="Canonical Luna/master checkpoint: $CANONICAL_BASE_SHA. Open review work checked before this run: $OPEN_PR_CONTEXT. This automated pull request refreshes candidate listings from fifteen high-signal regional source groups after rebuilding the authoritative site and checking its navigation, Promote routes, data paths, and Netlify publish path. Candidate rows are not approved directory additions. Open the linked listing page and confirm relevance, identity, place, and contact details before merging any candidate into canonical public data."
          if ! gh pr create --draft --base master --head "$REVIEW_BRANCH" --title "Review weekly directory candidates" --body "$body"; then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${REVIEW_BRANCH}?expand=1"
            gh issue create --title "Directory-candidate review branch is ready" --body "$body Branch: $REVIEW_BRANCH One-click draft PR: $compare_url"
          fi

      - name: Upload directory-watch report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tri-county-weekly-directory-query-check-${{ github.run_id }}
          retention-days: 30
          path: |
            review/directory-watch/directory-watch-latest.json
            review/directory-watch/directory-watch-latest.md
            review/directory-connectivity/
            review/directory-outreach/
            review/maintenance/
