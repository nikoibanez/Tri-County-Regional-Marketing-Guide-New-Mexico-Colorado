name: Codex update proposal

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex-proposal:
    if: ${{ vars.ENABLE_CODEX_UPDATES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify current Luna/canonical checkpoint
        run: |
          git fetch origin master
          python scripts/verify_canonical_integration.py --require-current-master --source-only
          python tools/build_netlify_deep_guide.py
          python scripts/verify_canonical_integration.py

      - name: Capture open integration work for Codex
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/capture_open_pr_context.py --markdown .github/codex/prompts/current-integration-context.md

      - name: Run Codex proposal review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/source-update-review.md
          sandbox: workspace-write
          output-file: codex-update-proposal.md

      - name: Upload Codex proposal
        uses: actions/upload-artifact@v7
        with:
          name: codex-update-proposal
          path: codex-update-proposal.md
