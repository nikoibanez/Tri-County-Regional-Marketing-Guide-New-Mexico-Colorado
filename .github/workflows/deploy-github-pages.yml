name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify current Luna/canonical checkpoint
        run: |
          git fetch origin master
          python scripts/verify_canonical_integration.py --require-current-master --source-only

      - name: Build static site
        run: |
          python tools/build_netlify_deep_guide.py
          python tools/inject_deluxe_legacy_context.py
          python scripts/verify_canonical_integration.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/tri-county-netlify-guide-deep

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
