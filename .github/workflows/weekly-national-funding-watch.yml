name: Weekly regional and national funding watch

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * 2"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-national-funding-watch
  cancel-in-progress: false

jobs:
  funding-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify current Luna/canonical checkpoint
        id: canonical
        run: |
          git fetch origin master
          python scripts/verify_canonical_integration.py --require-current-master --source-only
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Capture open integration work
        id: coordination
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/capture_open_pr_context.py

      - name: Build canonical site
        run: python tools/build_netlify_deep_guide.py

      - name: Validate curated funding data
        run: python scripts/validate_national_funding_data.py

      - name: Run five subject-specific funding sweeps
        run: python scripts/audit_national_funding_sources.py --timeout 20

      - name: Build private maintenance dashboard
        run: python scripts/build_maintenance_dashboard.py

      - name: Verify canonical generated structure
        run: python scripts/verify_canonical_integration.py

      - name: Prepare funding review pull request
        id: review
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national-funding-watch-state.json
          git add review/national-funding-watch/national-funding-watch-latest.json
          git add review/national-funding-watch/national-funding-watch-latest.md
          git add review/maintenance/maintenance-dashboard-latest.json review/maintenance/maintenance-dashboard-latest.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            branch="automation/national-funding-watch-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "Refresh regional funding watch report"
            git push --set-upstream origin "$branch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Open human-review pull request
        if: steps.review.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: ${{ steps.review.outputs.branch }}
          CANONICAL_BASE_SHA: ${{ steps.canonical.outputs.base_sha }}
          OPEN_PR_CONTEXT: ${{ steps.coordination.outputs.open_pr_context }}
        shell: bash
        run: |
          body="Canonical Luna/master checkpoint: $CANONICAL_BASE_SHA. Open review work checked before this run: $OPEN_PR_CONTEXT. This automated pull request reports five independent sweeps of regional and national funding pages: economic development, education, healthcare, nonprofits, and arts & culture. It does not modify public opportunity records. Review the official page and confirm deadline, applicant type, 501(c)(3) status, fiscal-sponsor policy, award range, application cost, and marketing-cost eligibility before editing or merging any public claim."
          if ! gh pr create --draft --base master --head "$REVIEW_BRANCH" --title "Review regional funding source changes" --body "$body"; then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${REVIEW_BRANCH}?expand=1"
            gh issue create --title "National funding review branch is ready" --body "$body Branch: $REVIEW_BRANCH One-click draft PR: $compare_url"
          fi

      - name: Upload funding-watch report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: national-funding-watch-${{ github.run_id }}
          retention-days: 30
          path: |
            review/national-funding-watch/
            review/maintenance/
